[project]
name = "seedboxes"
version = "0.2.0"
description = "SeedLaser — 面向 K12 的激光切割设计软件：二维设计 → 3D 装配 → 加工作业（PyWebView 桌面端，中文界面，Windows / macOS）"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10,<3.11"
authors = [
    { name = "makerseed (种子创客工坊)" },
]
keywords = ["boxes", "laser-cutter", "pywebview", "desktop", "chinese", "seedboxes"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X :: Cocoa",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: Education",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3.10",
    "Topic :: Multimedia :: Graphics :: Editors :: Vector-Based",
]
dependencies = [
    "pywebview>=5.0",
    "boxes",
    "fonttools>=4.40",  # 中文刻字：系统字体字形 → 轮廓
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.0",
]

# boxes 通过 git 直接拉上游 release-1.2 标签（不污染本仓库 + 锁版本可复现）
[tool.uv.sources]
boxes = { git = "https://github.com/florianfesti/boxes", rev = "release-1.2" }

[project.urls]
Homepage = "https://github.com/makerseed201808/SeedLaser"
Repository = "https://github.com/makerseed201808/SeedLaser"
Upstream = "https://github.com/florianfesti/boxes"
